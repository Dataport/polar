name: Run tests

on: 
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: |
          npm ci
          npm run lint:ci
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.14.1
          registry-url: https://registry.npmjs.org/
      - run: |
          npm ci
          npm run tsc:ci

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.16.0
          registry-url: https://registry.npmjs.org/
          cache: npm
      - run: |
          npm ci
          npm run test
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Uses preinstalled dependencies needed for playwright tests. Version number musst match used playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        client:
          - dish
          - snowbox
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20.16.0
        registry-url: https://registry.npmjs.org/
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Build client
      run: npm run ${{ matrix.client }}:build
    - name: Run Playwright smoke tests
      run: npm run test:e2e:${{ matrix.client }} -- --tags "@smoke and not (@not_implemented or @fails)" --pass-with-no-tests
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: ${{ !cancelled() }}
      with:
        name: blob-report-${{ matrix.client }}
        path: blob-report/
        retention-days: 30

  e2e-merge-report:
    needs: e2e
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20.16.0
        registry-url: https://registry.npmjs.org/
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Download blob reports
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        pattern: blob-report-*
        path: all-blob-reports
        merge-multiple: true
    - name: Merge Playwright reports
      run: npx playwright merge-reports --reporter html ./all-blob-reports
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  
