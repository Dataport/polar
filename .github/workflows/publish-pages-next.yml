name: Publish bleeding-edge documentation to gh-pages/next

on:
  push:
    branches:
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org/
          cache: 'npm'

      - name: Install documentation build dependencies
        run: |
          sudo apt update
          sudo apt install mkdocs mkdocs-material

      - name: Install NPM dependencies
        run: npm ci

      - name: Build documentation
        run: npm run docs:ci

      - name: Deploy documentation to gh-pages/next
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs-html
          target-folder: next
