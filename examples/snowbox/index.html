<!doctype html>
<html lang="en">
	<head>
		<title>Snowbox</title>
		<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
		<link rel="stylesheet" href="@polar/polar/polar.css" />
		<script type="module" defer src="index.js"></script>
		<style>
			/* style just for example page, not directly related to POLAR */
			:root {
				--not-quite-white: #f2f3f4;
				--map-height: 600px;
			}

			body {
				font-family: sans-serif;
				padding: 2em;
				background: var(--not-quite-white);
				color: var(--eigengrau);
			}

			h1 {
				margin-bottom: 0.5em;
			}

			h2 {
				margin: 0.5em 0;
			}

			p {
				margin: 0.2em 0;
			}

			#language-switcher {
				outline: solid black;
			}

			.snowbox {
				width: 90vw;
				max-width: 100%;
				height: var(--map-height);
				margin-top: 10px;
				margin-bottom: 10px;
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
			}

			.polar-plugin-states {
			margin-top: 2em;
			font-family: monospace;
			font-size: 12px;
		}
		#polar-plugin-states .polar-plugin-states__store {
			margin-bottom: 1em;
			border: 1px solid #ccc;
			padding: 0.5em 1em;
			background: #fff;
		}
		#polar-plugin-states .polar-plugin-states__entry {
			display: grid;
			grid-template-columns: 16em 1fr;
			gap: 1em;
			padding: 0.15em 0;
			border-top: 1px solid #eee;
		}
		</style>
	</head>

	<body>
		<h1>POLAR map client</h1>
		<label id="language-switcher-label">
			Language in map client:
			<select id="language-switcher">
				<option value="en">English</option>
				<option value="de">German</option>
			</select>
		</label>
		<button id="color-scheme-switcher">Switch to dark mode</button>
		<div>
			Coordinates of currently selected feature: <span id="selected-feature-coordinates"></span>
		</div>
		<h2>Demo application ("Snowbox")</h2>
		<div style="display: flex; justify-content: center;">
			<div id="snowbox" class="snowbox"></div>
		</div>
		<div style="margin-top: 4em"></div>
		<h2>Second map</h2>
		<button id="secondMap">Add a map client</button>
		<button id="secondMapClean">Remove all map clients below</button>
		<div id="secondMapContainer"></div>
		<section id="polar-plugin-states"></section>
	</body>
</html>
